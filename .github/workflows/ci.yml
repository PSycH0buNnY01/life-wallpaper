# ci.yml — minimale security-poort uit de basis-pipeline
# (vault: reference/tools/basis-pipeline-sjabloon/github/workflows/ci.yml).
#
# Waarom dit bestand: zonder workflow is er nooit een groene run op de kop,
# en de merge-regel eist zo'n run. Deze repo heeft geen testcommando, dus
# alleen gitleaks (S1a). Acties en de gitleaks-release staan vast op dezelfde
# SHA/checksum als het sjabloon.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scant de hele geschiedenis
      - name: S1a secrets in de geschiedenis (gitleaks, checksum gecontroleerd)
        shell: bash
        env:
          GL_VERSIE: "8.30.1"
          GL_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSIE}/gitleaks_${GL_VERSIE}_linux_x64.tar.gz"
          echo "${GL_SHA256}  /tmp/gl.tgz" | sha256sum -c -
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner --exit-code 1 .
